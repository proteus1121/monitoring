networks:
  monitoring-net:
    driver: overlay
    attachable: true

services:
  traefik:
    image: traefik:v2.10
    # host mode bypasses the swarm ingress mesh: single node, and a broken ingress network
    # ("error creating vxlan interface: file exists") must not take the site down
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/${SSH_USER}/deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /home/${SSH_USER}/deploy/traefik/acme.json:/acme.json
    networks:
      - monitoring-net
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"

        # Dashboard over HTTPS
        - "traefik.http.routers.api.rule=Host(`traefik.ssn.pp.ua`)"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.routers.api.service=api@internal"
        - "traefik.http.routers.api.tls=true"
        - "traefik.http.routers.api.tls.certresolver=myresolver"

        # Optional: HTTP -> HTTPS redirect for everything (doesn't break ACME)
        - "traefik.http.routers.http-catchall.rule=HostRegexp(`{any:.+}`)"
        - "traefik.http.routers.http-catchall.entrypoints=web"
        - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  mysql-db:
    image: bitnamilegacy/mysql:9.4.0-debian-12-r1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS}
      MYSQL_DATABASE: monitoring
    volumes:
      - /home/${SSH_USER}/deploy/mysql:/bitnami/mysql
      - /home/${SSH_USER}/deploy/mysql/my_custom.cnf:/opt/bitnami/mysql/conf/my_custom.cnf:ro
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql-db
    depends_on:
      - mysql-db
    networks:
      - monitoring-net
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.db.rule=Host(`db.ssn.pp.ua`)"
        - "traefik.http.routers.db.entrypoints=websecure"
        - "traefik.http.routers.db.tls=true"
        - "traefik.http.routers.db.tls.certresolver=myresolver"
        # phpMyAdmin listens on 80
        - "traefik.http.services.db.loadbalancer.server.port=80"

  mosquitto:
    # mosquitto with the go-auth plugin: logins checked in the site database (mosquitto/config/mosquitto.conf)
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    # owner of the data and log folders on the server (chown in the deploy step)
    user: "1883:1883"
    ports:
      - target: 1883
        published: 1883
        mode: host
    volumes:
      - /home/${SSH_USER}/deploy/mosquitto/config/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - /home/${SSH_USER}/deploy/mosquitto/data:/mosquitto/data
      - /home/${SSH_USER}/deploy/mosquitto/log:/mosquitto/log
    networks:
      - monitoring-net
    deploy:
      replicas: 1

  monitoring-backend:
    image: ghcr.io/proteus1121/monitoring-backend:latest
    environment:
      PROFILE: ${PROFILE}
      MYSQL_PASS: ${MYSQL_PASS}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      GEMINI_KEY: ${GEMINI_KEY}
      GRAFANA_KEY: ${GRAFANA_KEY}
    depends_on:
      - mysql-db
    networks:
      - monitoring-net
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.backend.rule=Host(`api.ssn.pp.ua`)"
        - "traefik.http.routers.backend.entrypoints=websecure"
        - "traefik.http.routers.backend.tls=true"
        - "traefik.http.routers.backend.tls.certresolver=myresolver"
        - "traefik.http.services.backend.loadbalancer.server.port=8080"

  monitoring-frontend:
    image: ghcr.io/proteus1121/monitoring-frontend:latest
    depends_on:
      - mysql-db
    networks:
      - monitoring-net
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`ssn.pp.ua`)"
        - "traefik.http.routers.frontend.entrypoints=websecure"
        - "traefik.http.routers.frontend.tls=true"
        - "traefik.http.routers.frontend.tls.certresolver=myresolver"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"
