persistence true
listener 1883 0.0.0.0
allow_anonymous false
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Logins are checked by mosquitto-go-auth in the site database, table mqtt_accounts (MqttAccountEntity):
# a board linked on the site has its own login and only its owner's topics, the backend is a superuser.
# auth_opt_mysql_password is appended by CI (.github/workflows/release.yml).
auth_plugin /mosquitto/go-auth.so
auth_opt_log_level info
auth_opt_backends mysql
auth_opt_hasher bcrypt
auth_opt_hasher_cost 10
auth_opt_mysql_host mysql-db
auth_opt_mysql_port 3306
auth_opt_mysql_dbname monitoring
auth_opt_mysql_user root
# MySQL may still be starting with the stack
auth_opt_mysql_connect_tries -1
auth_opt_mysql_userquery SELECT password_hash FROM mqtt_accounts WHERE username = ? LIMIT 1
auth_opt_mysql_superquery SELECT COUNT(*) FROM mqtt_accounts WHERE username = ? AND superuser = 1
# second parameter: 1 read, 2 write, 3 both, 4 subscribe - a board may do all of them on its owner's topics
auth_opt_mysql_aclquery SELECT CONCAT('users/', user_id, '/#') FROM mqtt_accounts WHERE username = ? AND user_id IS NOT NULL AND ? > 0
