; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; local, not in git: [ota] password and board addresses, see secrets.example.ini
extra_configs = secrets.ini
default_envs = esp32dev, esp8266

; Wi-Fi updates (src/system/Ota.h). Without a password the firmware keeps OTA off.
[ota]
password =
esp8266_host = esp8266.local
esp32_host = esp32.local
; the board connects back to this port of the computer; allow it in the firewall once:
; New-NetFirewallRule -DisplayName "ESP OTA" -Direction Inbound -Protocol TCP -LocalPort 8266 -RemoteAddress LocalSubnet -Action Allow
host_port = 8266

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit BMP085 Library@^1.2.4
	adafruit/Adafruit SSD1306@^2.5.16
	olikraus/U8g2@^2.33.15
upload_speed = 115200
upload_resetmethod = ck
build_flags = -DOTA_PASSWORD=\"${ota.password}\"

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${ota.esp32_host}
upload_flags =
	--auth=${ota.password}
	--host_port=${ota.host_port}

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit BMP085 Library@^1.2.4
	adafruit/Adafruit SSD1306@^2.5.16
	olikraus/U8g2@^2.33.15
lib_ignore = AViShaESPCam
upload_speed = 115200
build_flags = -DOTA_PASSWORD=\"${ota.password}\"

[env:esp8266-ota]
extends = env:esp8266
upload_protocol = espota
upload_port = ${ota.esp8266_host}
upload_flags =
	--auth=${ota.password}
	--host_port=${ota.host_port}
