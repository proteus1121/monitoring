; PlatformIO Project Configuration File
;
; One firmware for every supported board; each [env:<board>] builds it for one of them. The env name is
; the board id: the firmware reports it in its hello and the site picks the update file by it
; (tools/firmware_manifest.py, firmware/manifest.json on the site).
;
; Libraries are pinned here and nothing comes from a local Arduino folder, so CI builds the same binary
; as a developer machine.

[platformio]
; local, not in git: [ota] password and board addresses, see secrets.example.ini
extra_configs = secrets.ini
default_envs = esp32dev, esp8266

; Wi-Fi updates from this computer (src/system/Ota.h). Without a password the firmware keeps OTA off;
; updates from the site do not need it.
[ota]
password =
esp8266_host = esp8266.local
esp32_host = esp32.local
; the board connects back to this port of the computer; allow it in the firewall once:
; New-NetFirewallRule -DisplayName "ESP OTA" -Direction Inbound -Protocol TCP -LocalPort 8266 -RemoteAddress LocalSubnet -Action Allow
host_port = 8266

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
	adafruit/Adafruit BMP085 Library@1.2.4
	adafruit/Adafruit BusIO@1.17.4
	olikraus/U8g2@2.36.12
	bblanchon/ArduinoJson@7.4.2
	knolleary/PubSubClient@2.8
	beegee-tokyo/DHT sensor library for ESPx@1.19
	amperka/TroykaMQ@1.0.0
build_flags =
	-DOTA_PASSWORD=\"${ota.password}\"
	-DBOARD_ID=\"${PIOENV}\"

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
upload_resetmethod = ck

[env:esp32dev-ota]
extends = env:esp32dev
build_flags =
	-DOTA_PASSWORD=\"${ota.password}\"
	-DBOARD_ID=\"esp32dev\"
upload_protocol = espota
upload_port = ${ota.esp32_host}
upload_flags =
	--auth=${ota.password}
	--host_port=${ota.host_port}

[env:esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2

[env:esp8266-ota]
extends = env:esp8266
build_flags =
	-DOTA_PASSWORD=\"${ota.password}\"
	-DBOARD_ID=\"esp8266\"
upload_protocol = espota
upload_port = ${ota.esp8266_host}
upload_flags =
	--auth=${ota.password}
	--host_port=${ota.host_port}
