server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # the home page, prerendered at build (src/prerender.tsx)
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # every other route of the app gets the empty shell, not the home page's markup
    location / {
        try_files $uri /app.html;
    }

    location = /app.html {
        add_header Cache-Control "no-cache";
    }

    # firmware built by CI (scripts/.../tools/firmware_manifest.py); a missing file is a 404, not the app
    location /firmware/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/json json;
            application/octet-stream bin;
        }
    }
}
