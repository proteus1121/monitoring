server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # firmware built by CI (scripts/.../tools/firmware_manifest.py); a missing file is a 404, not the app
    location /firmware/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/json json;
            application/octet-stream bin;
        }
    }
}
