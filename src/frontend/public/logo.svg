<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- same aperture as the spinning Logo component: six skewed blades clipped by a circle -->
  <defs>
    <clipPath id="aperture">
      <circle cx="32" cy="32" r="20"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <g clip-path="url(#aperture)" fill="#fff">
    <polygon id="blade" points="26,12 46,0.45 46,14.45 26,26"/>
    <use href="#blade" transform="rotate(60 32 32)"/>
    <use href="#blade" transform="rotate(120 32 32)"/>
    <use href="#blade" transform="rotate(180 32 32)"/>
    <use href="#blade" transform="rotate(240 32 32)"/>
    <use href="#blade" transform="rotate(300 32 32)"/>
  </g>
</svg>
