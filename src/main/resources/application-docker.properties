spring.datasource.url=jdbc:mysql://mysql-db:3306/monitoring
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

mqtt.broker.url=tcp://mosquitto:1883
mqtt.broker.username=${MQTT_USER}
mqtt.broker.password=${MQTT_PASS}

server.servlet.session.cookie.domain=ssn.pp.ua
server.servlet.session.timeout=12h
server.servlet.session.cookie.max-age=12h
server.servlet.session.cookie.path=/
# TODO: add /me endpoint, change http-only to true 
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=true
# TODO: REMOVE NEXT LINE BEFORE RELEASE 
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.name=SESSION
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.session=DEBUG
logging.level.org.springframework.session.jdbc=DEBUG

telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.api.base-url=https://api.telegram.org/bot${telegram.bot-token}

http.retry.period=1000
http.retry.max-period=60000
http.retry.attempts=10

# traefik terminates TLS, take scheme and host from X-Forwarded-* headers
server.forward-headers-strategy=framework

# Sign in with Google / GitHub, a provider is enabled only when its id and secret are set
sso.base-url=https://api.ssn.pp.ua
sso.frontend-url=https://ssn.pp.ua
sso.google.client-id=${GOOGLE_CLIENT_ID:}
sso.google.client-secret=${GOOGLE_CLIENT_SECRET:}
sso.github.client-id=${GITHUB_CLIENT_ID:}
sso.github.client-secret=${GITHUB_CLIENT_SECRET:}

# E-mail notifications over SMTP, disabled while MAIL_HOST is empty
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
notifications.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Descriptions written by a language model (Gemini), disabled while GEMINI_KEY is empty
llm.gemini.api-key=${GEMINI_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
llm.language=${LLM_LANGUAGE:Ukrainian}
