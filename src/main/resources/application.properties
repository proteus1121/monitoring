spring.datasource.url=jdbc:mysql://localhost:3306/monitoring
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

mqtt.broker.url=tcp://localhost:1883

server.servlet.session.timeout=12h
server.servlet.session.cookie.max-age=12h
server.servlet.session.cookie.path=/
# TODO: add /me endpoint, change http-only to true 
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=true
# TODO: REMOVE NEXT LINE BEFORE RELEASE 
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.name=SESSION
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.session=DEBUG
logging.level.org.springframework.session.jdbc=DEBUG

telegram.bot-token=token
telegram.api.base-url=https://api.telegram.org/bot${telegram.bot-token}

http.retry.period=1000
http.retry.max-period=60000
http.retry.attempts=10

# ============================================================
# ML Anomaly Detection Configuration
# ============================================================
# Anomaly Detection: Always uses rule-based (threshold and pattern detection)
# XGBoost: Used only for time-series predictions (not anomaly detection)
ml.enabled=true
ml.threshold=0.72

# ============================================================
# Feature Engineering Configuration
# ============================================================
features.windowMinutes=5
features.defaultImpute.temperature=22.0
features.defaultImpute.humidity=45.0
features.defaultImpute.lpg=0.0
features.defaultImpute.ch4=0.0
features.defaultImpute.smoke=0.0
features.defaultImpute.flame=0.0
features.defaultImpute.light=200.0
features.defaultImpute.pressure=1013.0
features.defaultImpute.motion=0.0

# Sign in with Google / GitHub (empty = disabled)
sso.frontend-url=http://localhost:3000
sso.google.client-id=${GOOGLE_CLIENT_ID:}
sso.google.client-secret=${GOOGLE_CLIENT_SECRET:}
sso.github.client-id=${GITHUB_CLIENT_ID:}
sso.github.client-secret=${GITHUB_CLIENT_SECRET:}

# E-mail notifications over SMTP, disabled while MAIL_HOST is empty
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
notifications.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Descriptions written by a language model (Gemini), disabled while GEMINI_KEY is empty
llm.gemini.api-key=${GEMINI_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
llm.language=${LLM_LANGUAGE:Ukrainian}
